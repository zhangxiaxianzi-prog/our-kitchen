<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两人厨房 · 白名单管理</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head>
<body><main><header><div><p class="brand">两人厨房</p><h1>白名单管理</h1></div><button id="logout" hidden>退出登录</button></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login"><h2>用小程序确认登录</h2><p>打开两人厨房小程序，微信登录后选择“扫描登录管理网页”。</p><img id="qr" alt="管理员登录二维码" width="280" height="280" hidden><p id="login-status"></p><button id="new-login" class="primary">生成登录二维码</button></section>
<section id="workspace" hidden>
<p class="hint">名单修改最多60秒生效。白名单免除厨房数量和每日创建次数限制。</p>
<div class="toolbar"><label>账号标识<input id="search" placeholder="输入完整账号标识搜索" maxlength="64"></label><button id="find">搜索</button><button id="all">全部名单</button></div>
<section class="add"><h2>添加账号</h2><form id="add-form"><label>账号标识<input id="user" required maxlength="64" autocomplete="off" placeholder="由对方在小程序中复制"></label><label>备注<input id="note" maxlength="80" placeholder="用于辨认账号"></label><button class="primary" type="submit">加入白名单</button></form></section>
<div class="table-wrap"><table><caption>当前名单</caption><thead><tr><th>账号与备注</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><button id="next" hidden>下一页名单</button>
<section class="audit"><h2>修改记录</h2><button id="load-audit">刷新记录</button><ol id="audit"></ol><button id="next-audit" hidden>更早的记录</button></section>
</section></main></body></html>
